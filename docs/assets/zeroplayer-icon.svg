  <title id="zp-title">zeroplayer — 白色立体丝带图标</title>
  <desc id="zp-description">零形外轮廓与播放形状的负空间融合。白色材质，灰度受光与折叠阴影。所有形状均为可编辑矢量路径，没有内嵌位图。</desc>
  <defs>
    <!-- Back-facing ribbon: shadow → light → shadow. -->
    <linearGradient id="zp-inner-surface" gradientUnits="userSpaceOnUse"
                    x1="400" y1="383" x2="400" y2="888">
      <stop offset="0" stop-color="#919191"/>
      <stop offset="0.08" stop-color="#9d9d9d"/>
      <stop offset="0.25" stop-color="#cfcfcf"/>
      <stop offset="0.40" stop-color="#ebebeb"/>
      <stop offset="0.57" stop-color="#fafafa"/>
      <stop offset="0.67" stop-color="#f6f6f6"/>
      <stop offset="0.80" stop-color="#dddddd"/>
      <stop offset="0.90" stop-color="#aaaaaa"/>
      <stop offset="1" stop-color="#868686"/>
    </linearGradient>
    <radialGradient id="zp-inner-bounce" gradientUnits="userSpaceOnUse"
                    cx="0" cy="0" r="1"
                    gradientTransform="translate(304 894) scale(184 174)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.43"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Upper face: neutral white with a broad, gentle modelling shadow. -->
    <radialGradient id="zp-top-surface" gradientUnits="userSpaceOnUse"
                    cx="0" cy="0" r="1"
                    gradientTransform="translate(935 378) scale(410 320)">
      <stop offset="0" stop-color="#d1d1d1"/>
      <stop offset="0.36" stop-color="#dddddd"/>
      <stop offset="0.66" stop-color="#efefef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <!-- Lower face: front light falls off towards the lower-left edge. -->
    <linearGradient id="zp-bottom-surface" gradientUnits="userSpaceOnUse"
                    x1="700" y1="760" x2="480" y2="1090">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#eeeeee"/>
      <stop offset="0.70" stop-color="#d5d5d5"/>
      <stop offset="1" stop-color="#bababa"/>
    </linearGradient>
    <radialGradient id="zp-right-fold-shadow" gradientUnits="userSpaceOnUse"
