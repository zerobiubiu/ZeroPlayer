<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>文件传输 - ZeroPlayer</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到主要内容</a>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"></circle>
          <path d="M10 8.3v7.4l5.8-3.7L10 8.3Z" fill="currentColor"></path>
        </svg>
        <span>ZeroPlayer</span>
      </div>
      <span id="connection-status" class="connection-status" role="status" aria-live="polite">正在连接</span>
    </div>
  </header>

  <main id="main" class="page">
    <h1>Wi-Fi 文件传输</h1>
    <p id="connection-error" class="message message-error" role="alert" hidden>连接已断开。请检查网络和手机上的文件服务。</p>
    <noscript><p class="message message-error">此页面需要启用 JavaScript 才能传输和管理文件。</p></noscript>

    <div class="workspace">
      <section class="upload-section" aria-labelledby="upload-title">
        <h2 id="upload-title" tabindex="-1">上传到手机</h2>
        <div class="destination">
          <span>保存到</span>
          <bdi id="upload-path">正在读取目录…</bdi>
          <a href="#files-title">浏览目录</a>
        </div>
        <div id="drop-zone" class="drop-zone">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V3m-4.5 4.5L12 3l4.5 4.5M4 14v4a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-4"/>
          </svg>
          <div class="drop-copy">
            <input id="file-input" class="visually-hidden" type="file" multiple disabled aria-describedby="upload-hint">
            <label id="choose-files" class="button button-primary" for="file-input">选择文件</label>
            <span id="upload-hint">支持多选<span class="drag-hint">或拖放</span></span>
          </div>
        </div>

        <section id="queue-panel" aria-labelledby="queue-title" hidden>
          <div class="queue-heading">
            <div>
              <h3 id="queue-title">传输队列</h3>
              <p id="queue-summary"></p>
            </div>
            <button id="clear-finished" class="button button-quiet" type="button" hidden>清除已结束</button>
          </div>
          <div class="actions">
            <button id="start-uploads" class="button button-primary" type="button" hidden>开始上传</button>
            <button id="cancel-upload" class="button button-secondary" type="button" hidden>取消当前传输</button>
            <button id="clear-pending" class="button button-quiet" type="button" hidden>清空待上传</button>
          </div>
          <ol id="queue-list" class="queue-list" aria-labelledby="queue-title"></ol>
        </section>
        <p id="queue-hint" class="hint" role="status" hidden></p>
        <aside class="notice" aria-label="网络提示">HTTP 明文传输，无需登录。仅在可信网络使用，能连接的设备可读写和删除文件。</aside>
      </section>

      <section class="files-section" aria-labelledby="files-title">
        <div class="section-heading">
          <h2 id="files-title" tabindex="-1">手机文件</h2>
          <div class="section-actions">
            <button id="create-folder" class="button button-secondary" type="button" disabled>新建文件夹</button>
            <button id="refresh-files" class="button button-quiet" type="button">刷新</button>
          </div>
        </div>
        <nav aria-label="当前目录"><ol id="breadcrumbs" class="breadcrumbs"></ol></nav>
        <a class="return-upload" href="#upload-title">返回上传</a>
        <p id="files-state" class="list-state" role="status">正在读取目录…</p>
        <ul id="files-list" class="entry-list" aria-label="当前目录内容"></ul>
      </section>
    </div>
    <p id="announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>

  <dialog id="action-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <form id="action-form">
      <h2 id="dialog-title"></h2>
      <p id="dialog-description" class="dialog-description"></p>
      <div id="dialog-fields" class="dialog-fields"></div>
      <p id="dialog-error" class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="button button-secondary" type="button">取消</button>
        <button id="dialog-submit" class="button button-primary" type="submit">确定</button>
      </div>
    </form>
  </dialog>
</body>
</html>
