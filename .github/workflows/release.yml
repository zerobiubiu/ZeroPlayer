name: Release

# 推送 vX.Y.Z 标签即在仓库 Release 中发布 ARM64 安装包；
# 也可手动指定版本号补发（会补建同名标签）。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀），例如 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          sdkmanager="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platform-tools" "build-tools;36.0.0" > /dev/null
          installed=0
          for pkg in "platforms;android-37.0" "platforms;android-37"; do
            if "$sdkmanager" --install "$pkg" > /dev/null 2>&1; then
              echo "已安装 $pkg"
              installed=1
              break
            fi
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::无法安装 compileSdk 37 对应的 SDK Platform"
            exit 1
          fi

      - name: 解析版本号
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            name="$INPUT_VERSION"
          else
            name="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号必须是 X.Y.Z，实际为：$name"
            exit 1
          fi
          major=${name%%.*}
          rest=${name#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          code=$((major * 10000 + minor * 100 + patch))
          {
            echo "name=$name"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "版本 $name，versionCode $code"

      - name: 使用固定发行密钥构建
        env:
          KEYSTORE_BASE64: ${{ secrets.ZEROPLAYER_KEYSTORE_BASE64 }}
          ZEROPLAYER_STORE_PASSWORD: ${{ secrets.ZEROPLAYER_STORE_PASSWORD }}
          ZEROPLAYER_KEY_ALIAS: ${{ secrets.ZEROPLAYER_KEY_ALIAS }}
          ZEROPLAYER_KEY_PASSWORD: ${{ secrets.ZEROPLAYER_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          for field in KEYSTORE_BASE64 ZEROPLAYER_STORE_PASSWORD ZEROPLAYER_KEY_ALIAS ZEROPLAYER_KEY_PASSWORD; do
            if [[ -z "${!field:-}" ]]; then
              echo "::error::发行签名配置不完整，拒绝构建和发布。"
              exit 1
            fi
          done
          umask 077
          export ZEROPLAYER_STORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f -- "$ZEROPLAYER_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ZEROPLAYER_STORE_FILE"
          unset KEYSTORE_BASE64
          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" --stacktrace

      - name: 校验并整理产物
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          bash tools/verify-release-apk.sh "$apk" "$ANDROID_HOME/build-tools/36.0.0" "$VERSION_NAME" "$VERSION_CODE"
          out="ZeroPlayer-$VERSION_NAME-arm64-v8a.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          cat "$out.sha256"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.name }}"
          name: "ZeroPlayer ${{ steps.version.outputs.name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ZeroPlayer-${{ steps.version.outputs.name }}-arm64-v8a.apk
            ZeroPlayer-${{ steps.version.outputs.name }}-arm64-v8a.apk.sha256
