name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 编译、测试与静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "build-tools;36.0.0" > /dev/null
          installed=0
          for pkg in "platforms;android-37.0" "platforms;android-37"; do
            if sdkmanager --install "$pkg" > /dev/null 2>&1; then
              echo "已安装 $pkg"
              installed=1
              break
            fi
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::无法安装 compileSdk 37 对应的 SDK Platform"
            exit 1
          fi

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: 构建调试包
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 归档报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            */build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
